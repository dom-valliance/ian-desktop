name: Ian

options:
  xcodeVersion: "2600"
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"

packages:
  IanKit:
    path: ../Packages/IanKit

targets:
  Ian:
    type: application
    platform: macOS
    sources:
      - Sources
    dependencies:
      - package: IanKit
        product: IanKit
    settings:
      base:
        PRODUCT_NAME: Ian
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ian
        INFOPLIST_KEY_LSUIElement: YES
        # The lance-dev sign-in settings (AGENTS.md erratum E2). The tenant id is from Lance's
        # entra-setup runbook. The client id and scope stay empty until Lance package DL1
        # registers "Ian Desktop (dev)" and exposes the api scope; docs/companion/lance-track.md.
        IAN_LANCE_TENANT_ID: ac995b50-b931-4d4b-b0ea-c0617e8141f9
        IAN_LANCE_CLIENT_ID: ""
        IAN_LANCE_SCOPE: ""
        # Xcode only copies known INFOPLIST_KEY_ names, so Info.plist maps these into the bundle.
        INFOPLIST_FILE: Info.plist
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: ai.valliance.ian.desktop.dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: ai.valliance.ian.desktop

schemes:
  Ian:
    build:
      targets:
        Ian: all
