name: Ian

options:
  xcodeVersion: "2600"
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"

packages:
  IanKit:
    path: ../Packages/IanKit

targets:
  Ian:
    type: application
    platform: macOS
    sources:
      - Sources
    dependencies:
      - package: IanKit
        product: IanKit
    settings:
      base:
        PRODUCT_NAME: Ian
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ian
        INFOPLIST_KEY_LSUIElement: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: ai.valliance.ian.desktop.dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: ai.valliance.ian.desktop

schemes:
  Ian:
    build:
      targets:
        Ian: all
