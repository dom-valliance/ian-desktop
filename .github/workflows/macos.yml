name: macOS

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same Xcode build developers use, 27.1 (27A9275) (ADR 0010).
      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer

      - name: Print toolchain and system versions
        run: |
          sw_vers
          defaults read -g AppleLocale || true
          defaults read com.apple.universalaccess reduceMotion || true
          xcodebuild -version
          swift --version
          swift format --version

      - name: Lint Swift formatting
        run: swift format lint --recursive --strict Packages App scripts

      - name: Build IanKit
        run: swift build --package-path Packages/IanKit --force-resolved-versions

      - name: Test IanKit
        run: swift test --package-path Packages/IanKit --force-resolved-versions
        env:
          SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/snapshot-artifacts

      - name: Keep failed snapshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-snapshots
          path: ${{ runner.temp }}/snapshot-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Check generated code is current
        run: scripts/check-generated.sh

      - name: Build the app
        run: xcodebuild -project App/Ian.xcodeproj -scheme Ian -configuration Debug -destination 'platform=macOS' -onlyUsePackageVersionsFromResolvedFile build
