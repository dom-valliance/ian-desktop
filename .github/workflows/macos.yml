name: macOS

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Xcode 26 is the build floor (ADR 0008).
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Print toolchain versions
        run: |
          xcodebuild -version
          swift --version
          swift format --version

      - name: Lint Swift formatting
        run: swift format lint --recursive --strict Packages App

      - name: Build IanKit
        run: swift build --package-path Packages/IanKit

      - name: Test IanKit
        run: swift test --package-path Packages/IanKit

      - name: Check generated code is current
        run: scripts/check-generated.sh

      - name: Build the app
        run: xcodebuild -project App/Ian.xcodeproj -scheme Ian -configuration Debug -destination 'platform=macOS' build
